# ---------------------------------------------------------------------------
# Apache configuration for the Our Coffee Shop ordering system.
#
# Install:
#   1. Copy this file to C:/xampp/apache/conf/extra/httpd-ourcoffee.conf
#   2. Add this line at the end of C:/xampp/apache/conf/httpd.conf:
#          Include conf/extra/httpd-ourcoffee.conf
#   3. Restart Apache from the XAMPP Control Panel.
#
# Then:
#   Customer site   http://localhost/ourcoffee
#   Admin site      http://localhost/ourcoffee-admin
#
# Only customer-site, admin-site and assets are exposed. shared/, database/
# and storage/ stay outside the web root on purpose, so no one can request
# the database credentials or the logs over HTTP.
# ---------------------------------------------------------------------------

Define OURCOFFEE_ROOT "C:/CLIENT PROJECTS/CoffeeShop"

# Shared brand assets. This alias must come first, because Apache matches
# aliases in order and /ourcoffee would otherwise swallow /ourcoffee/assets.
Alias "/ourcoffee/assets" "${OURCOFFEE_ROOT}/assets"
Alias "/ourcoffee-admin/assets" "${OURCOFFEE_ROOT}/assets"

<Directory "${OURCOFFEE_ROOT}/assets">
    Options -Indexes -ExecCGI +FollowSymLinks
    AllowOverride None
    Require all granted

    # Static assets are safe to cache hard.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </IfModule>

    # Never let PHP execute from the assets folder, even if something is
    # uploaded there by mistake.
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

Alias "/ourcoffee-admin" "${OURCOFFEE_ROOT}/admin-site"
Alias "/ourcoffee" "${OURCOFFEE_ROOT}/customer-site"

<Directory "${OURCOFFEE_ROOT}/customer-site">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory "${OURCOFFEE_ROOT}/admin-site">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>

# Belt and braces: refuse anything under the private folders even if a future
# alias accidentally exposes them.
<Directory "${OURCOFFEE_ROOT}/shared">
    Require all denied
</Directory>
<Directory "${OURCOFFEE_ROOT}/database">
    Require all denied
</Directory>
<Directory "${OURCOFFEE_ROOT}/storage">
    Require all denied
</Directory>
