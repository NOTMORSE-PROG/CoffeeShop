<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    Icon sprite. Use with:
      <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#icon-cart"></use></svg>

    All icons share a 24x24 box and are stroke-based, so they inherit
    currentColor and line up optically at the same size.
  -->
  <defs>
